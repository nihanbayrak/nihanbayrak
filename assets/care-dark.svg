.g.r { animation-name: hop-r; }
@keyframes hop {
  0%   { transform: none; }
  5%   { transform: translateY(-16px) rotate(-6deg); }
  10%  { transform: translateY(2px) rotate(2deg); }
  14%  { transform: none; }
  100% { transform: none; }
}
@keyframes hop-r {
  0%   { transform: none; }
  5%   { transform: translateY(-16px) rotate(6deg); }
  10%  { transform: translateY(2px) rotate(-2deg); }
  14%  { transform: none; }
  100% { transform: none; }
}
