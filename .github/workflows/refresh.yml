name: Redraw the profile

# No nightly schedule any more. The ledger was the only piece that read the
# GitHub API; with it gone the render is deterministic and a scheduled run
# could never produce a diff. What is left is worth keeping: this catches a
# render that stops working when tools/ or data/ change.

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "data/**"
      - ".github/workflows/refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet numpy pillow

      - name: Render
        run: python tools/render.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "Redraw the object, $(date -u +%Y-%m-%d)"
          git push
