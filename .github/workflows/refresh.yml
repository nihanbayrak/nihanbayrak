name: Redraw the profile

# Daily, and on a push that touches tools/ or data/: refetch the GitHub numbers
# with this workflow's own token and redraw the card. Uptime moves every day, so
# expect a commit a day. Versions are pinned: this runs unattended.

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "data/**"
      - ".github/workflows/refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet fonttools==4.63.0 uharfbuzz==0.56.0

      - name: Fetch the numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/stats.py

      - name: Draw the card
        run: python tools/neofetch.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git diff --staged --quiet || git commit -m "Redraw the card, $(date -u +%Y-%m-%d)"
          git push
