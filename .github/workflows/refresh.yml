name: Redraw the profile

on:
  schedule:
    - cron: "17 4 * * *"     # nightly, after the contribution graph settles
  push:
    branches: [main]
    paths:
      - "data/profile.toml"
      - "tools/**"
      - ".github/workflows/refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet fonttools uharfbuzz brotli numpy

      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/render.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/stats.json
          git diff --staged --quiet || git commit -m "Redraw: numbers as of $(date -u +%Y-%m-%d)"
          git push
