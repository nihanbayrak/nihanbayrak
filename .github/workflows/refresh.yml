name: Redraw the profile

# On a push that touches tools/ or data/, re-render the octopus's swim and the
# title, which catches a render that stops working. Versions are pinned: this
# runs unattended.

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "data/**"
      - ".github/workflows/refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redraw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet numpy==2.5.2 pillow==12.3.0 fonttools==4.63.0 uharfbuzz==0.56.0

      - name: Render the octopus swimming
        run: python tools/render.py

      - name: Set the title
        run: python tools/title.py

      - name: Commit if anything moved
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "Redraw the octopus, $(date -u +%Y-%m-%d)"
          git push
